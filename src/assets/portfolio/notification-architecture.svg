<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Notification delivery architecture</title>
  <desc id="description">Producer services such as APIs, admin tools, and batch jobs enqueue every notification in one Redis-backed BullMQ queue that applies rate limits, delays, and retries. Horizontally scaled workers consume the queue and send messages through an external messaging API. Workers look up messages in the operational database with read-only access. Without waiting on the write, they record delivery events as delivery history in Parquet files on S3, one file per day, which a monitoring app queries with DuckDB. Logs go to Elasticsearch, traces go through OpenTelemetry to APM, and metrics go to Prometheus and Grafana.</desc>

