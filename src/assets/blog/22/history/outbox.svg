<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="ob-title ob-desc">
  <title id="ob-title">Transactional outbox pattern</title>
  <desc id="ob-desc">An application writes the business table and the outbox table in a single local transaction. A separate relay reads new outbox rows by polling or change data capture and delivers them to an analysis platform with at-least-once delivery, so a committed state change never loses its event.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    text { font-family: Pretendard, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
    .title { font-size: 30px; font-weight: 700; letter-spacing: -0.6px; }
    .subtitle { font-size: 15px; fill: #64748B; }
    .node-title { font-size: 15px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 13px; fill: #64748B; }
    .edge-label { font-size: 13px; font-weight: 600; fill: #475569; paint-order: stroke; stroke: #F8FAFC; stroke-width: 5px; stroke-linejoin: round; }
    .node { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .edge-blue { fill: none; stroke: #2563EB; stroke-width: 2; marker-end: url(#arrow-blue); stroke-linecap: round; stroke-linejoin: round; }
    .edge-teal { fill: none; stroke: #0F766E; stroke-width: 2; marker-end: url(#arrow-teal); stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1120" height="460" fill="#F8FAFC"/>

  <text class="title" x="40" y="46">Transactional Outbox Pattern</text>
  <text class="subtitle" x="40" y="72">State change + outbox row in one commit → relay reads the outbox → delivers at-least-once</text>

  <!-- Local transaction boundary -->
  <rect x="290" y="104" width="320" height="296" rx="18" fill="#FAF5FF" fill-opacity="0.62" stroke="#8A3391" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="350" y="384" width="200" height="32" rx="16" fill="#F3E8FF" stroke="#8A3391" stroke-width="1.2"/>
  <circle cx="368" cy="400" r="5" fill="#8A3391"/>
  <text class="label" x="380" y="405" fill="#6B2473">One local transaction</text>

  <!-- App -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="40" y="150" width="180" height="66" rx="12"/>
    <g transform="translate(52 161)">
      <rect width="44" height="44" rx="8" fill="#2563EB"/>
      <path d="M17 15 l-6 7 6 7 M27 15 l6 7 -6 7 M24 13 l-4 18" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="node-title" x="108" y="180">App</text>
    <text class="small" x="108" y="202">business logic</text>
  </g>

  <!-- Business table -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="320" y="150" width="270" height="66" rx="12"/>
    <g transform="translate(332 161)">
      <rect width="44" height="44" rx="8" fill="#2563EB"/>
      <ellipse cx="22" cy="13" rx="13" ry="5.5" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <path d="M9 13 v18 a13 5.5 0 0 0 26 0 v-18" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>
    <text class="node-title" x="388" y="180">Business table</text>
    <text class="small" x="388" y="202">state change</text>
  </g>

  <!-- Outbox table -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="320" y="254" width="270" height="66" rx="12"/>
    <g transform="translate(332 265)">
      <rect width="44" height="44" rx="8" fill="#8A3391"/>
      <ellipse cx="22" cy="13" rx="13" ry="5.5" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <path d="M9 13 v18 a13 5.5 0 0 0 26 0 v-18" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>
    <text class="node-title" x="388" y="284">Outbox table</text>
    <text class="small" x="388" y="306">event as a row</text>
  </g>

  <!-- Relay -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="680" y="254" width="170" height="66" rx="12"/>
    <g transform="translate(692 265)">
      <rect width="44" height="44" rx="8" fill="#0F766E"/>
      <path d="M12 17 h16 m0 0 l-5 -5 m5 5 l-5 5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M32 28 h-16 m0 0 l5 -5 m-5 5 l5 5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="node-title" x="748" y="284">Relay</text>
    <text class="small" x="748" y="306">polling · CDC</text>
  </g>

  <!-- Analysis platform -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="900" y="254" width="200" height="66" rx="12"/>
    <g transform="translate(912 265)">
      <rect width="44" height="44" rx="8" fill="#475569"/>
      <path d="M14 32 V22 M22 32 V12 M30 32 V17" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M10 32 H34" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text class="node-title" x="968" y="284">Analysis platform</text>
    <text class="small" x="968" y="306">dedupe on read</text>
  </g>

  <!-- Edges -->
  <path class="edge-blue" d="M220 183 H316"/>
  <path class="edge-blue" d="M220 191 C 265 191 272 287 316 287"/>
  <text class="edge-label" x="250" y="245" text-anchor="middle">one commit</text>

  <path class="edge-teal" d="M590 287 H676"/>
  <text class="edge-label" x="633" y="279" text-anchor="middle">new rows</text>

  <path class="edge-teal" d="M850 287 H896"/>
  <text class="edge-label" x="873" y="279" text-anchor="middle">at-least-once</text>
</svg>
