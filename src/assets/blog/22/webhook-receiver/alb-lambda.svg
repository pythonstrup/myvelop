      <path d="M41 25 l13 10 l13-10" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linejoin="round"/>
    </g>
    <text class="node-title" x="124" y="194" text-anchor="middle">Third-party</text>
    <text class="node-title" x="124" y="215" text-anchor="middle">Messaging API</text>
    <text class="small" x="124" y="235" text-anchor="middle">AlimTalk &#183; LMS</text>
  </g>

  <!-- ALB (shared) -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="250" y="138" width="175" height="66" rx="12"/>
    <use href="#icon-alb" x="258" y="146" width="50" height="50"/>
    <text class="node-title" x="316" y="168">ALB</text>
    <text class="small" x="316" y="190">shared &#183; reused</text>
  </g>

  <!-- Lambda (verify + filter) -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="475" y="138" width="190" height="66" rx="12"/>
    <use href="#icon-lambda" x="483" y="146" width="50" height="50"/>
    <text class="node-title" x="541" y="166">Lambda</text>
    <text class="small" x="541" y="187">verify &#183; 200 OK</text>
  </g>

  <!-- Firehose -->
  <g filter="url(#soft-shadow)">
