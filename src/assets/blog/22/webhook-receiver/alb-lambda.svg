    .title { font-size: 30px; font-weight: 700; letter-spacing: -0.6px; }
    .subtitle { font-size: 15px; fill: #64748B; }
    .node-title { font-size: 15px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 13px; fill: #64748B; }
    .edge-label { font-size: 13px; font-weight: 600; fill: #475569; paint-order: stroke; stroke: #F8FAFC; stroke-width: 5px; stroke-linejoin: round; }
    .node { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .node-muted { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge-blue { fill: none; stroke: #2563EB; stroke-width: 2; marker-end: url(#arrow-blue); stroke-linecap: round; stroke-linejoin: round; }
    .edge-teal { fill: none; stroke: #0F766E; stroke-width: 2; marker-end: url(#arrow-teal); stroke-linecap: round; stroke-linejoin: round; }
    .edge-slate { fill: none; stroke: #94A3B8; stroke-width: 2; marker-end: url(#arrow-slate); stroke-linecap: round; stroke-linejoin: round; }
    .edge-dashed { stroke-dasharray: 7 7; }
  </style>

  <rect width="1120" height="560" fill="#F8FAFC"/>

  <text class="title" x="40" y="46">Notification Webhook Ingestion</text>
  <text class="subtitle" x="40" y="72">Third-party messaging &#8594; shared ALB &#8594; Lambda (verify &#183; filter) &#8594; Firehose &#8594; History S3, then joins the existing pipeline</text>

  <!-- IaC manages the ingestion AWS resources (Lambda, target group, Firehose, S3). -->
  <rect x="455" y="108" width="470" height="302" rx="18" fill="#FAF5FF" fill-opacity="0.62" stroke="#8A3391" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="734" y="394" width="180" height="30" rx="15" fill="#F3E8FF" stroke="#8A3391" stroke-width="1.2"/>
  <circle cx="751" cy="409" r="5" fill="#8A3391"/>
  <text class="small" x="763" y="414" fill="#6B2473">Ingestion boundary</text>

  <!-- Third-party messaging provider (external) -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="40" y="90" width="168" height="156" rx="18"/>
    <g transform="translate(84 113)">
      <path d="M18 54 H74 C88 54 96 45 96 34 C96 23 88 14 77 13 C72 4 64 0 54 0 C40 0 29 9 27 22 C17 23 10 30 10 39 C10 47 13 51 18 54 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
