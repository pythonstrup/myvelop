    <use href="#icon-s3-bucket" x="733" y="308" width="50" height="50"/>
    <text class="node-title" x="791" y="330">History S3</text>
    <text class="small" x="791" y="352">raw archive</text>
  </g>

  <!-- Existing pipeline (reused, muted) -->
  <g filter="url(#soft-shadow)">
    <rect class="node-muted" x="475" y="300" width="190" height="66" rx="12"/>
    <text class="node-title" x="495" y="328" fill="#475569">SQS &#8594; Lambda</text>
    <text class="node-title" x="495" y="348" fill="#475569">&#8594; Analysis platform</text>
  </g>

  <!-- k8s control plane: manages only the listener rule -->
  <rect x="250" y="244" width="175" height="52" rx="12" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text class="label" x="270" y="266" fill="#0F766E">k8s Ingress</text>
  <text class="small" x="270" y="285" fill="#0F766E">listener rule only</text>
  <path class="edge-teal edge-dashed" d="M337 244 V208"/>
  <text class="edge-label" x="387" y="232" text-anchor="middle" fill="#0F766E">annotation</text>

