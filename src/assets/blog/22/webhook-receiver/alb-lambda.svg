    </g>
    <g transform="translate(166 318)">
      <rect width="44" height="44" rx="8" fill="#844FBA"/>
      <path transform="translate(7 7) scale(1.25)" d="M1.44 0v7.575l6.561 3.79V3.787zm21.12 4.227l-6.561 3.791v7.574l6.56-3.787zM8.72 4.23v7.575l6.561 3.787V8.018zm0 8.405v7.575L15.28 24v-7.578z" fill="#FFFFFF"/>
    </g>
    <text class="node-title" x="150" y="392" text-anchor="middle">Pulumi or Terraform</text>
    <text class="small" x="150" y="430" text-anchor="middle">AWS infra as code</text>
  </g>
  <path class="edge-teal edge-dashed" d="M260 375 H451"/>
  <text class="edge-label" x="356" y="363" text-anchor="middle" fill="#0F766E">Deploy</text>

  <!-- flow -->
  <path class="edge-blue" d="M208 171 H246"/>
  <text class="edge-label" x="227" y="160" text-anchor="middle">HTTPS</text>

  <path class="edge-blue" d="M425 171 H471"/>
  <text class="edge-label" x="448" y="160" text-anchor="middle">target group</text>

  <path class="edge-blue" d="M665 171 H721"/>
  <text class="edge-label" x="693" y="160" text-anchor="middle">PutRecord</text>

  <path class="edge-blue" d="M810 204 V296"/>
  <text class="edge-label" x="822" y="256">flush</text>

  <path class="edge-slate edge-dashed" d="M725 333 H669"/>
  <text class="edge-label" x="697" y="322" text-anchor="middle" fill="#64748B">s3:ObjectCreated</text>

  <!-- insight footnotes -->
  <g>
    <rect x="300" y="474" width="480" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <circle cx="318" cy="489" r="4" fill="#2563EB"/>
    <text class="small" x="330" y="494" fill="#1E3A8A">Traffic never enters EKS &#8212; ALB invokes Lambda directly</text>
  </g>
  <g>
    <rect x="300" y="512" width="480" height="30" rx="15" fill="#FEF3F2" stroke="#FECACA" stroke-width="1"/>
    <circle cx="318" cy="527" r="4" fill="#DC2626"/>
    <text class="small" x="330" y="532" fill="#991B1B">Lambda runs outside any VPC &#8212; no NAT Gateway cost</text>
  </g>
</svg>
