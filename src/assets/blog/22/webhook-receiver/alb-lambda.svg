    <use href="#icon-firehose" x="733" y="146" width="50" height="50"/>
    <text class="node-title" x="791" y="168">Data Firehose</text>
    <text class="small" x="791" y="190">record buffer</text>
  </g>

  <!-- History S3 -->
  <g filter="url(#soft-shadow)">
