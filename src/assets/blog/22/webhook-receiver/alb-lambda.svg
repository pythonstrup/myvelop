        <path d="M45 24V56"/>
        <path d="M45 24H55"/>
        <path d="M45 40H55"/>
        <path d="M45 56H55"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="26" cy="40" r="6"/>
        <circle cx="57" cy="24" r="4"/>
        <circle cx="57" cy="40" r="4"/>
        <circle cx="57" cy="56" r="4"/>
      </g>
    </symbol>

