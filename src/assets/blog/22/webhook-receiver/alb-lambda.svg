<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="sw-title sw-desc">
  <title id="sw-title">Notification webhook ingestion</title>
  <desc id="sw-desc">A third-party messaging provider sends delivery report webhooks over HTTPS to a shared Application Load Balancer. The ALB forwards each request to a Lambda target group; the routing rule is the only thing Kubernetes manages, through an Ingress annotation, so webhook traffic never enters the EKS cluster. The Lambda verifies the HMAC secret, drops non-terminal status codes, and returns 200 immediately, then puts the record into Amazon Data Firehose, which buffers records and writes them into the History S3 bucket. From S3 onward it reuses the existing delivery-history pipeline of SQS, Lambda and the analysis platform. The Lambda runs outside any VPC so no NAT Gateway cost is incurred, and every AWS resource in the ingestion boundary is defined and deployed with IaC such as Pulumi or Terraform.</desc>

