    <text class="node-title" x="812" y="472" text-anchor="middle">Pulumi or Terraform</text>
    <text class="small" x="812" y="508" text-anchor="middle">AWS infra as code</text>
  </g>
  <path class="edge-teal edge-dashed" d="M812 378 V358"/>
  <text class="edge-label" x="830" y="372">Deploy</text>

  <!-- flow -->
  <path class="edge-blue" d="M208 168 H246"/>
  <text class="edge-label" x="227" y="157" text-anchor="middle">HTTPS</text>

  <path class="edge-blue" d="M415 168 H464"/>
  <text class="edge-label" x="440" y="157" text-anchor="middle">IP target (k8s)</text>

  <path class="edge-blue" d="M663 168 H716"/>
  <text class="edge-label" x="690" y="157" text-anchor="middle">PutRecord</text>

  <path class="edge-blue" d="M802 200 V274"/>
  <text class="edge-label" x="814" y="240">flush</text>

  <path class="edge-slate edge-dashed" d="M720 310 H689"/>
  <text class="edge-label" x="702" y="299" text-anchor="middle" fill="#64748B">s3:ObjectCreated</text>

  <!-- insight footnotes -->
  <g>
    <rect x="40" y="430" width="470" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <circle cx="58" cy="445" r="4" fill="#2563EB"/>
    <text class="small" x="70" y="450" fill="#1E3A8A">Traffic enters EKS &#8212; the worker pod handles the webhook</text>
  </g>
  <g>
    <rect x="40" y="468" width="470" height="30" rx="15" fill="#FEF3F2" stroke="#FECACA" stroke-width="1"/>
    <circle cx="58" cy="483" r="4" fill="#DC2626"/>
    <text class="small" x="70" y="488" fill="#991B1B">Shares node CPU headroom &#183; scales with HPA (max 3)</text>
  </g>
</svg>
