<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="wa-title wa-desc">
  <title id="wa-title">Notification webhook ingestion (application)</title>
  <desc id="wa-desc">A third-party messaging provider sends delivery report webhooks over HTTPS to a shared Application Load Balancer. In this variant the ALB uses an IP target group and routes straight into the EKS cluster, so a NestJS worker pod receives the webhook itself. Kubernetes manages the whole entry path through the Ingress: the listener, the IP target group and pod registration. The pod verifies the HMAC secret, drops non-terminal status codes and returns 200 immediately, then uses IRSA to put the record into Amazon Data Firehose, which buffers records into the History S3 bucket. From S3 onward it reuses the existing delivery-history pipeline of SQS, Lambda and the analysis platform. Because the pod handles the traffic, it shares node CPU headroom and scales with the HPA. Firehose and S3 are defined and deployed with IaC such as Pulumi or Terraform.</desc>

