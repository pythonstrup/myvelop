    .title { font-size: 30px; font-weight: 700; letter-spacing: -0.6px; }
    .subtitle { font-size: 15px; fill: #64748B; }
    .node-title { font-size: 15px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 13px; fill: #64748B; }
    .edge-label { font-size: 13px; font-weight: 600; fill: #475569; paint-order: stroke; stroke: #F8FAFC; stroke-width: 5px; stroke-linejoin: round; }
    .node { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .node-muted { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge-blue { fill: none; stroke: #2563EB; stroke-width: 2; marker-end: url(#arrow-blue); stroke-linecap: round; stroke-linejoin: round; }
    .edge-teal { fill: none; stroke: #0F766E; stroke-width: 2; marker-end: url(#arrow-teal); stroke-linecap: round; stroke-linejoin: round; }
    .edge-slate { fill: none; stroke: #94A3B8; stroke-width: 2; marker-end: url(#arrow-slate); stroke-linecap: round; stroke-linejoin: round; }
    .edge-dashed { stroke-dasharray: 7 7; }
  </style>

  <rect width="1120" height="560" fill="#F8FAFC"/>

  <text class="title" x="40" y="46">Notification Webhook Ingestion &#183; Application</text>
  <text class="subtitle" x="40" y="72">Third-party messaging &#8594; shared ALB (IP target) &#8594; NestJS worker pod (verify &#183; filter) &#8594; Firehose &#8594; History S3</text>

  <!-- EKS boundary: traffic enters the cluster; the pod handles the webhook -->
  <rect x="445" y="86" width="240" height="178" rx="16" fill="#FFF9F4" stroke="#ED7100" stroke-width="1.8" stroke-dasharray="7 5"/>
  <use href="#icon-eks" x="457" y="96" width="26" height="26"/>
  <text class="small" x="491" y="114" fill="#9A3412">Amazon EKS</text>

  <!-- IaC boundary: storage resources -->
  <rect x="700" y="108" width="225" height="246" rx="18" fill="#FAF5FF" fill-opacity="0.62" stroke="#8A3391" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="700" y="338" width="176" height="30" rx="15" fill="#F3E8FF" stroke="#8A3391" stroke-width="1.2"/>
  <circle cx="717" cy="353" r="5" fill="#8A3391"/>
  <text class="small" x="729" y="358" fill="#6B2473">Ingestion boundary</text>

