    </g>
    <text class="node-title" x="545" y="160">NestJS worker</text>
    <text class="small" x="545" y="181">verify &#183; 200 OK</text>
  </g>

  <!-- Firehose -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="720" y="136" width="165" height="64" rx="12"/>
    <use href="#icon-firehose" x="728" y="143" width="50" height="50"/>
    <text class="node-title" x="786" y="166">Data Firehose</text>
    <text class="small" x="786" y="187">record buffer</text>
  </g>

  <!-- History S3 -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="720" y="278" width="165" height="64" rx="12"/>
    <use href="#icon-s3-bucket" x="728" y="285" width="50" height="50"/>
    <text class="node-title" x="786" y="308">History S3</text>
    <text class="small" x="786" y="329">raw archive</text>
  </g>

  <!-- Existing pipeline (reused, muted) -->
  <g filter="url(#soft-shadow)">
    <rect class="node-muted" x="445" y="278" width="240" height="64" rx="12"/>
    <text class="node-title" x="465" y="306" fill="#475569">SQS &#8594; Lambda</text>
    <text class="node-title" x="465" y="326" fill="#475569">&#8594; Analysis platform</text>
  </g>

