    </g>
    <text class="node-title" x="124" y="196" text-anchor="middle">Third-party</text>
    <text class="node-title" x="124" y="217" text-anchor="middle">Messaging API</text>
    <text class="small" x="124" y="237" text-anchor="middle">AlimTalk &#183; LMS</text>
  </g>

  <!-- ALB (shared) -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="250" y="136" width="165" height="64" rx="12"/>
    <use href="#icon-alb" x="258" y="143" width="50" height="50"/>
    <text class="node-title" x="316" y="166">ALB</text>
    <text class="small" x="316" y="187">shared &#183; reused</text>
  </g>

  <!-- App pod (NestJS worker) inside EKS -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="468" y="130" width="195" height="76" rx="12"/>
    <g transform="translate(480 134)">
      <rect x="0" y="12" width="50" height="45" rx="8" fill="#326CE5"/>
