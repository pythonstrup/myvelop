<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="pq-title pq-desc">
  <title id="pq-title">JSON landing zone and daily Parquet conversion</title>
  <desc id="pq-desc">A worker lands one JSON object per job in S3, so a day's partition holds thousands of small objects. There is no event trigger. Once a day a cron job scans the whole partition and folds it into a single large Parquet file. An engine reads the Parquet files for yesterday and before, plus today's JSON directly from the landing zone.</desc>

  <defs>
    <marker id="pq-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="pq-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <marker id="pq-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <filter id="pq-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    text { font-family: Pretendard, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
    .title { font-size: 30px; font-weight: 700; letter-spacing: -0.6px; }
    .subtitle { font-size: 15px; fill: #64748B; }
    .node-title { font-size: 15px; font-weight: 700; }
    .small { font-size: 13px; fill: #64748B; }
    .edge-label { font-size: 13px; font-weight: 600; fill: #475569; paint-order: stroke; stroke: #F8FAFC; stroke-width: 5px; stroke-linejoin: round; }
    .edge-label-muted { font-size: 13px; font-weight: 600; fill: #64748B; paint-order: stroke; stroke: #F8FAFC; stroke-width: 5px; stroke-linejoin: round; }
    .node { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .chip-many { fill: #DBEAFE; stroke: #2563EB; stroke-width: 1.2; }
    .chip-one { fill: #CCFBF1; stroke: #0F766E; stroke-width: 1.5; }
    .edge-blue { fill: none; stroke: #2563EB; stroke-width: 2; marker-end: url(#pq-arrow-blue); stroke-linecap: round; stroke-linejoin: round; }
    .edge-teal { fill: none; stroke: #0F766E; stroke-width: 2; marker-end: url(#pq-arrow-teal); stroke-linecap: round; stroke-linejoin: round; }
    .edge-dashed { fill: none; stroke: #94A3B8; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#pq-arrow-gray); stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1120" height="360" fill="#F8FAFC"/>

  <text class="title" x="40" y="46">JSON Landing Zone → Daily Parquet</text>
  <text class="subtitle" x="40" y="72">JSON lands per job all day → no event trigger, a cron job folds the whole day at once → one large Parquet file</text>

  <!-- What one day looks like on each side -->
  <text class="small" x="280" y="104">a day's partition · thousands of small objects</text>
  <rect class="chip-many" x="280" y="112" width="24" height="32" rx="4"/>
  <rect class="chip-many" x="311" y="112" width="24" height="32" rx="4"/>
  <rect class="chip-many" x="342" y="112" width="24" height="32" rx="4"/>
  <rect class="chip-many" x="373" y="112" width="24" height="32" rx="4"/>
  <rect class="chip-many" x="404" y="112" width="24" height="32" rx="4"/>
  <rect class="chip-many" x="435" y="112" width="24" height="32" rx="4"/>
  <text class="small" x="468" y="136">…</text>

  <text class="small" x="620" y="104">one large file</text>
  <rect class="chip-one" x="620" y="112" width="86" height="32" rx="4"/>

  <!-- Worker -->
  <g filter="url(#pq-soft-shadow)">
    <rect class="node" x="40" y="185" width="170" height="66" rx="12"/>
    <g transform="translate(52 196)">
      <rect width="44" height="44" rx="8" fill="#2563EB"/>
      <path d="M17 15 l-6 7 6 7 M27 15 l6 7 -6 7 M24 13 l-4 18" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="node-title" x="108" y="215">Worker</text>
    <text class="small" x="108" y="237">unchanged</text>
  </g>

  <!-- S3 JSON (landing zone) -->
  <g filter="url(#pq-soft-shadow)">
    <rect class="node" x="280" y="185" width="250" height="66" rx="12"/>
    <g transform="translate(292 196)">
      <rect width="44" height="44" rx="8" fill="#2563EB"/>
      <ellipse cx="22" cy="13" rx="13" ry="5.5" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <path d="M9 13 v18 a13 5.5 0 0 0 26 0 v-18" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>
    <text class="node-title" x="348" y="215">S3 JSON · landing zone</text>
    <text class="small" x="348" y="237">dt=date/group.json · row</text>
  </g>

  <!-- S3 Parquet -->
  <g filter="url(#pq-soft-shadow)">
    <rect class="node" x="620" y="185" width="250" height="66" rx="12"/>
    <g transform="translate(632 196)">
      <rect width="44" height="44" rx="8" fill="#0F766E"/>
      <path d="M13 12 v20 M22 12 v20 M31 12 v20" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text class="node-title" x="688" y="215">S3 Parquet</text>
    <text class="small" x="688" y="237">dt=date/ · columnar</text>
  </g>

  <!-- Engine -->
  <g filter="url(#pq-soft-shadow)">
    <rect class="node" x="940" y="185" width="140" height="66" rx="12"/>
    <g transform="translate(952 196)">
      <rect width="44" height="44" rx="8" fill="#475569"/>
      <path d="M14 32 V22 M22 32 V12 M30 32 V17" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M10 32 H34" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text class="node-title" x="1008" y="224">Engine</text>
  </g>

  <!-- Edges -->
  <path class="edge-blue" d="M210 218 H276"/>
  <text class="edge-label" x="243" y="173" text-anchor="middle">per job</text>

  <path class="edge-teal" d="M530 218 H616"/>
  <text class="edge-label" x="573" y="173" text-anchor="middle">cron · once a day, whole partition</text>

  <path class="edge-teal" d="M870 218 H936"/>
  <text class="edge-label" x="903" y="173" text-anchor="middle">≤ yesterday</text>

  <!-- Today's data still lives as JSON -->
  <path class="edge-dashed" d="M405 251 V290 Q405 310 425 310 H990 Q1010 310 1010 290 V257"/>
  <text class="edge-label-muted" x="707" y="303" text-anchor="middle">today only · read as JSON, UNION at query time</text>
</svg>
