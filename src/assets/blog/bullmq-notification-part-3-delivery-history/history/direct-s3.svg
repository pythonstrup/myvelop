<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="dh-title dh-desc">
  <title id="dh-title">Delivery history pipeline</title>
  <desc id="dh-desc">Notification workers archive delivery events by writing them straight into a History S3 bucket with a single S3 PutObject call — both single and bulk sends take the same direct path, with no streaming buffer in front of the bucket. Each new object raises an S3 event notification into Amazon SQS with a dead-letter queue, and an AWS Lambda consumer polls those batches, transforms them, and writes rows into the analysis platform. Every AWS resource inside the delivery-history boundary is defined and deployed with IaC such as Pulumi or Terraform.</desc>

