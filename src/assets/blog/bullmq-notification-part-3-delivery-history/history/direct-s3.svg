  <g filter="url(#soft-shadow)">
    <rect class="node" x="40" y="150" width="220" height="66" rx="12"/>
    <g transform="translate(52 161)">
      <rect width="44" height="44" rx="8" fill="#326CE5"/>
      <path d="M11 16 h22 M11 23 h16 M11 30 h9" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <text class="node-title" x="108" y="180">Worker</text>
    <text class="small" x="108" y="202">delivery result event</text>
  </g>

  <!-- History S3 -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="440" y="150" width="200" height="66" rx="12"/>
    <use href="#icon-s3-bucket" x="448" y="159" width="48" height="48"/>
    <text class="node-title" x="504" y="180">History S3</text>
    <text class="small" x="504" y="202">raw · uncompressed</text>
  </g>

  <!-- SQS -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="340" y="270" width="200" height="66" rx="12"/>
    <use href="#icon-sqs" x="348" y="279" width="48" height="48"/>
    <text class="node-title" x="404" y="300">SQS + DLQ</text>
    <text class="small" x="404" y="322">retry buffer</text>
  </g>

  <!-- Lambda -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="340" y="390" width="200" height="66" rx="12"/>
    <use href="#icon-lambda" x="348" y="399" width="48" height="48"/>
    <text class="node-title" x="404" y="420">Lambda</text>
    <text class="small" x="404" y="442">batch transform · WIF</text>
  </g>

  <!-- Analysis platform -->
  <g filter="url(#soft-shadow)">
    <rect class="node" x="860" y="390" width="220" height="66" rx="12"/>
    <g transform="translate(872 401)">
      <rect width="44" height="44" rx="8" fill="#475569"/>
      <path d="M14 32 V22 M22 32 V12 M30 32 V17" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M10 32 H34" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text class="node-title" x="928" y="420">Analysis platform</text>
    <text class="small" x="928" y="442">delivery history table</text>
  </g>

