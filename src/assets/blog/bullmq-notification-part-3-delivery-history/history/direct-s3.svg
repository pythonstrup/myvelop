  <text class="edge-label" x="283" y="412" text-anchor="middle" fill="#0F766E">Deploy</text>

  <!-- flow: both single and bulk write straight to S3 with PutObject (no Firehose) -->
  <path class="edge-blue" d="M260 183 H436"/>
  <text class="edge-label" x="348" y="172" text-anchor="middle">PutObject · single · bulk</text>

  <path class="edge-blue" d="M540 216 V240 H440 V266"/>
  <text class="edge-label" x="490" y="234" text-anchor="middle">s3:ObjectCreated</text>

  <path class="edge-blue" d="M440 336 V386"/>
  <text class="edge-label" x="452" y="366">poll · batch</text>

  <path class="edge-blue" d="M540 423 H856"/>
  <text class="edge-label" x="698" y="412" text-anchor="middle">insert</text>
</svg>
