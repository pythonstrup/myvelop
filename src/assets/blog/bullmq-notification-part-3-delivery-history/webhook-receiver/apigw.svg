<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="wg-title wg-desc">
  <title id="wg-title">Notification webhook ingestion (API Gateway)</title>
  <desc id="wg-desc">A third-party messaging provider sends delivery report webhooks over HTTPS to an Amazon API Gateway HTTP API. Using its native SQS integration, API Gateway puts each request straight onto an SQS queue with a dead-letter queue, so no compute runs at ingestion. A Lambda then polls the queue in batches, verifies the HMAC secret, drops non-terminal status codes and writes objects into the History S3 bucket. From S3 onward it reuses the existing delivery-history pipeline of SQS, Lambda and the analysis platform. There is no load balancer, no EKS cluster and no pods; the whole path is fully managed and priced per request, with SQS absorbing spikes and retries. Every AWS resource is defined and deployed with IaC such as Pulumi or Terraform.</desc>

