<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" role="img" aria-labelledby="irsa-title irsa-desc">
  <title id="irsa-title">IRSA — IAM Roles for Service Accounts</title>
  <desc id="irsa-desc">A ServiceAccount is annotated with an IAM role ARN. On pod creation the EKS-managed Pod Identity Webhook mutates the pod spec, injecting AWS_ROLE_ARN, AWS_WEB_IDENTITY_TOKEN_FILE and a projected service account token volume. The kubelet writes a short-lived JWT signed by the cluster key into that path, with audience sts.amazonaws.com and subject system:serviceaccount:namespace:name. The AWS SDK picks up the env vars and calls sts:AssumeRoleWithWebIdentity with the token. STS validates the signature against the cluster OIDC issuer's public JWKS, which is registered in IAM as an OIDC identity provider, and checks the role's trust policy conditions on aud and sub. It returns temporary credentials that expire in about an hour and are refreshed automatically by the SDK, so the pod holds no static access key and does not inherit the node instance profile.</desc>

  <defs>
    <marker id="irsa-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="irsa-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <marker id="irsa-arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EA580C"/>
    </marker>
    <marker id="irsa-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>
    <marker id="irsa-arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>

    <filter id="irsa-soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    text { font-family: Pretendard, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
    .title { font-size: 30px; font-weight: 700; letter-spacing: -0.6px; }
    .subtitle { font-size: 15px; fill: #64748B; }
    .node-title { font-size: 15px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 13px; fill: #64748B; }
    .foot { font-size: 13px; fill: #64748B; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; fill: #64748B; }
    .mono-hi { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; font-weight: 600; fill: #6D28D9; }
    .edge-label { font-size: 13px; font-weight: 600; fill: #475569; paint-order: stroke; stroke: #F8FAFC; stroke-width: 5px; stroke-linejoin: round; }
    .node { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .edge { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .edge-blue { stroke: #2563EB; marker-end: url(#irsa-arrow-blue); }
    .edge-teal { stroke: #0F766E; marker-end: url(#irsa-arrow-teal); }
    .edge-orange { stroke: #EA580C; marker-end: url(#irsa-arrow-orange); }
    .edge-green { stroke: #16A34A; marker-end: url(#irsa-arrow-green); }
    .edge-slate { stroke: #94A3B8; marker-end: url(#irsa-arrow-slate); }
    .edge-dashed { stroke-dasharray: 7 7; }
  </style>

  <rect width="1240" height="800" fill="#F8FAFC"/>

  <text class="title" x="40" y="46">IRSA — IAM Roles for Service Accounts</text>
  <text class="subtitle" x="40" y="72">A pod proves who it is with a signed ServiceAccount token, and STS hands back credentials scoped to one role</text>

  <!-- cluster boundary -->
  <rect x="40" y="112" width="400" height="482" rx="18" fill="#EEF2FF" fill-opacity="0.62" stroke="#326CE5" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="64" y="96" width="176" height="32" rx="16" fill="#E0E7FF" stroke="#326CE5" stroke-width="1.2"/>
  <circle cx="82" cy="112" r="5" fill="#326CE5"/>
  <text class="label" x="94" y="117" fill="#1D4ED8">EKS cluster</text>

  <!-- aws boundary -->
  <rect x="812" y="112" width="388" height="482" rx="18" fill="#FFF7ED" fill-opacity="0.7" stroke="#EA580C" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="836" y="96" width="232" height="32" rx="16" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.2"/>
  <circle cx="854" cy="112" r="5" fill="#EA580C"/>
  <text class="label" x="866" y="117" fill="#C2410C">AWS account · IAM &amp; STS</text>

  <!-- ServiceAccount -->
  <g filter="url(#irsa-soft-shadow)">
    <rect class="node" x="64" y="148" width="352" height="92" rx="12"/>
    <g transform="translate(84 172)">
      <rect width="44" height="44" rx="8" fill="#326CE5"/>
      <circle cx="22" cy="17" r="6.5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M11 34 c0-6 5-9.5 11-9.5 s11 3.5 11 9.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text class="node-title" x="142" y="176">ServiceAccount</text>
    <text class="mono" x="142" y="200">eks.amazonaws.com/role-arn:</text>
    <text class="mono" x="142" y="220">arn:aws:iam::…:role/webhook</text>
  </g>

  <!-- Pod Identity Webhook -->
  <g filter="url(#irsa-soft-shadow)">
    <rect class="node" x="64" y="286" width="352" height="92" rx="12"/>
    <g transform="translate(84 310)">
      <rect width="44" height="44" rx="8" fill="#7C3AED"/>
      <path d="M11 22 h13" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M19 16 l6 6 l-6 6" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M31 11 v22" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <text class="node-title" x="142" y="314">Pod Identity Webhook</text>
    <text class="small" x="142" y="336">mutating admission · EKS-managed</text>
    <text class="mono" x="142" y="356">adds env + projected volume</text>
  </g>

  <!-- Pod -->
  <g filter="url(#irsa-soft-shadow)">
    <rect class="node" x="64" y="424" width="352" height="146" rx="12"/>
    <g transform="translate(84 448)">
      <rect width="44" height="44" rx="8" fill="#2563EB"/>
      <path d="M22 9 L34 16 V30 L22 37 L10 30 V16 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
      <path d="M10 16 L22 23 L34 16 M22 23 V37" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text class="node-title" x="142" y="452">Pod</text>
    <text class="small" x="142" y="474">AWS SDK credential chain</text>
    <rect x="84" y="492" width="316" height="62" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text class="mono" x="98" y="514">AWS_ROLE_ARN=arn:aws:iam…</text>
    <text class="mono" x="98" y="536">AWS_WEB_IDENTITY_TOKEN_FILE=…</text>
  </g>

  <!-- projected token -->
  <g filter="url(#irsa-soft-shadow)">
    <rect class="node" x="468" y="240" width="280" height="240" rx="12"/>
    <text class="node-title" x="492" y="278">Projected SA token (JWT)</text>
    <text class="small" x="492" y="300">written by kubelet · rotated</text>
    <path d="M 492 316 H 724" stroke="#E2E8F0" stroke-width="1.2"/>
    <text class="mono-hi" x="492" y="342">aud: sts.amazonaws.com</text>
    <text class="mono-hi" x="492" y="366">sub: system:serviceaccount:</text>
    <text class="mono-hi" x="492" y="386">     &lt;ns&gt;:&lt;sa&gt;</text>
    <text class="mono" x="492" y="410">exp: 24h · SDK re-reads</text>
    <text class="small" x="492" y="440">signed by the cluster key —</text>
    <text class="small" x="492" y="458">public JWKS at the OIDC issuer</text>
  </g>

  <!-- IAM OIDC provider -->
  <g filter="url(#irsa-soft-shadow)">
    <rect class="node" x="836" y="148" width="340" height="92" rx="12"/>
    <g transform="translate(856 172)">
      <rect width="44" height="44" rx="8" fill="#D97706"/>
      <circle cx="17" cy="17" r="6.4" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M21.5 21.5 L33 33" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M27 27 l-3.5 3.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text class="node-title" x="914" y="176">IAM OIDC provider</text>
    <text class="small" x="914" y="198">registered once per cluster</text>
    <text class="mono" x="914" y="218">iss: oidc.eks…/id/&lt;hash&gt;</text>
  </g>

  <!-- STS -->
  <g filter="url(#irsa-soft-shadow)">
    <rect class="node" x="836" y="286" width="340" height="92" rx="12"/>
    <g transform="translate(856 310)">
      <rect width="44" height="44" rx="8" fill="#EA580C"/>
      <path d="M22 8 L33 13 V23 c0 7-4.6 11-11 14 -6.4-3-11-7-11-14 V13 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
      <path d="M16.5 22 l4.2 4.2 L29 17.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="node-title" x="914" y="314">AWS STS</text>
    <text class="mono" x="914" y="336">AssumeRoleWithWebIdentity</text>
    <text class="small" x="914" y="356">validates JWT via issuer JWKS</text>
  </g>

  <!-- IAM role -->
  <g filter="url(#irsa-soft-shadow)">
    <rect class="node" x="836" y="424" width="340" height="146" rx="12"/>
    <g transform="translate(856 448)">
      <rect width="44" height="44" rx="8" fill="#DD344C"/>
      <rect x="12" y="20" width="20" height="15" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M16 20 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    </g>
    <text class="node-title" x="914" y="452">IAM role + trust policy</text>
    <text class="mono-hi" x="914" y="476">aud = sts.amazonaws.com</text>
    <text class="mono-hi" x="914" y="496">sub = system:serviceaccount:</text>
    <text class="mono-hi" x="914" y="516">      &lt;ns&gt;:&lt;sa&gt;</text>
    <text class="small" x="914" y="540">permissions attached to this role</text>
  </g>

  <!-- edges -->
  <path class="edge edge-blue" d="M 240 240 L 240 278"/>
  <text class="edge-label" x="252" y="266">reads annotation</text>

  <path class="edge edge-blue" d="M 240 378 L 240 416"/>
  <text class="edge-label" x="252" y="404">mutates pod spec</text>

  <path class="edge edge-slate edge-dashed" d="M 416 520 L 626 520 L 626 488"/>
  <text class="edge-label" x="440" y="512">reads token file</text>

  <path class="edge edge-blue" d="M 748 332 L 828 332"/>
  <text class="edge-label" x="788" y="320" text-anchor="middle">presents JWT</text>

  <path class="edge edge-teal edge-dashed" d="M 1006 240 L 1006 278"/>
  <text class="edge-label" x="1018" y="266">trusted issuer</text>

  <path class="edge edge-orange" d="M 1006 378 L 1006 416"/>
  <text class="edge-label" x="1018" y="404">conditions must match</text>

  <path class="edge edge-green" d="M 1006 570 L 1006 610"/>

  <path class="edge edge-green edge-dashed" d="M 240 610 L 240 574"/>
  <text class="edge-label" x="252" y="600">temp creds</text>

  <!-- credentials strip -->
  <rect x="40" y="618" width="1160" height="86" rx="14" fill="#F0FDF4" fill-opacity="0.8" stroke="#16A34A" stroke-width="1.6" stroke-dasharray="7 5"/>
  <g transform="translate(64 638)">
    <rect width="44" height="44" rx="8" fill="#16A34A"/>
    <circle cx="17" cy="17" r="6.4" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M21.5 21.5 L33 33" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M27 27 l-3.5 3.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="node-title" x="122" y="652">Temporary credentials</text>
  <text class="small" x="122" y="674">accessKeyId · secretAccessKey · sessionToken</text>
  <text class="label" x="560" y="652" fill="#15803D">No static AWS key in the image, env or a Secret</text>
  <text class="small" x="560" y="674">refreshed automatically before expiry · scoped to one role, one ServiceAccount</text>

  <!-- footnotes -->
  <text class="foot" x="40" y="742">Without IRSA the pod falls back to the node instance profile — every pod on that node then shares the same permissions.</text>
  <text class="foot" x="40" y="764">The <tspan font-weight="700">sub</tspan> condition pins the role to one namespace/ServiceAccount pair, so a pod in another namespace cannot assume it even with the same image.</text>
  <text class="foot" x="40" y="786">The webhook only injects env vars and a volume. An SDK too old to read <tspan font-weight="700">AWS_WEB_IDENTITY_TOKEN_FILE</tspan> ignores them and silently uses the node role instead.</text>
</svg>
